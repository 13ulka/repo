[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sceneforge"
version = "0.1.0"
description = "Reconstruct a film location from short clips into an editable Blender scene"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary / personal use" }
# Exact versions live in locks/main.txt (resolved for macOS arm64); these are lower bounds.
dependencies = [
  "typer>=0.12",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "scenedetect>=0.7.1",
  "open3d>=0.20.0",
  "psutil>=6.0",
  "pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sceneforge = "sceneforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sceneforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
